name: Publish documentation

on:
  push:
    branches: [main]
    paths: [newdocs/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newdocs/package-lock.json
      - run: npm ci
        working-directory: newdocs
      - run: npm run build
        working-directory: newdocs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: newdocs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
